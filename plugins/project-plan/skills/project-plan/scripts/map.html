<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project map</title>
<link rel="icon" href="data:,">
<script>
try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");
</script>
<style>
  /* Same tokens as the board (index.html): light-dark() follows color-scheme, which the theme switcher sets. */
  :root { color-scheme:light dark;
    --bg:light-dark(#f5f5f2, #111110); --card:light-dark(#fff, #1b1b19); --sunk:light-dark(#f0f0eb, #242421); --fg:light-dark(#1c1c1a, #ededea); --muted:light-dark(#66665f, #9d9d96); --line:light-dark(#e3e3dd, #2d2d2a);
    --accent:light-dark(#2f6fed, #7aa5ff); --on-accent:light-dark(#fff, #0d1a33); --accent-bg:light-dark(#eaf0fe, #1c2640);
    --done:light-dark(#1b8a4b, #3ec27a); --done-bg:light-dark(#e6f5ec, #15281d); --warn:light-dark(#a86a06, #e0a33a); --warn-bg:light-dark(#fdf3e1, #2d2311);
    --bad:light-dark(#d03f3f, #ef6b6b); --bad-bg:light-dark(#fdecec, #331a1a); --agent:light-dark(#7151d0, #a98bff); --agent-bg:light-dark(#efeafc, #241c3c);
    --on-bad:light-dark(#fff, #2a0d0d); --shadow:0 1px 2px light-dark(rgb(20 20 10 / .06), transparent); --head:light-dark(rgb(245 245 242 / .85), rgb(17 17 16 / .85));
    --edge:light-dark(#b9b9b0, #4a4a45); --edge-hot:var(--accent); --dot:light-dark(#dcdcd5, #262623);
    --float:0 6px 24px light-dark(rgb(20 20 10 / .12), rgb(0 0 0 / .5)), 0 1px 3px light-dark(rgb(20 20 10 / .08), rgb(0 0 0 / .4));
    --pw:380px; }
  :root[data-theme="light"] { color-scheme:light; }
  :root[data-theme="dark"] { color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; overflow:hidden; }
  button, input, textarea, select { font:inherit; color:inherit; }
  [hidden] { display:none !important; }
  .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
  .n { color:var(--muted); font-size:13px; }
  svg.i { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  /* header */
  header { flex:none; padding:10px 16px; background:var(--head); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line); display:grid; gap:8px; z-index:20; }
  .brandrow { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .embed .brandrow { display:none; }
  .brand { display:flex; gap:10px; align-items:center; min-width:0; }
  .logo { width:30px; height:30px; border-radius:9px; background:var(--fg); color:var(--bg); display:grid; place-items:center; font-weight:700; font-size:15px; flex:none; }
  h1 { font-size:17px; margin:0; letter-spacing:-.01em; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toolbar { display:flex; align-items:center; gap:8px 12px; flex-wrap:wrap; min-width:0; }
  .crumbs { display:flex; align-items:center; gap:2px; min-width:0; flex:1 1 220px; overflow:hidden; }
  .crumbs button { border:0; background:none; padding:4px 6px; border-radius:7px; cursor:pointer; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; font-size:13px; }
  .crumbs button:hover { background:var(--sunk); color:var(--fg); }
  .crumbs button[aria-current="page"] { color:var(--fg); font-weight:600; }
  .crumbs .sep { color:var(--line); flex:none; }
  .crumbs .back { flex:none; display:grid; place-items:center; width:30px; height:30px; padding:0; border:1px solid var(--line); background:var(--card); color:var(--fg); margin-right:6px; }
  .tools { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); background:var(--card); border-radius:10px; padding:6px 11px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:background .15s, border-color .15s; text-decoration:none; color:inherit; }
  .btn:disabled { opacity:.6; cursor:default; }
  .btn:not(:disabled):hover { border-color:var(--muted); }
  .btn[aria-pressed="true"], .btn[aria-expanded="true"] { border-color:var(--fg); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  .btn.primary:not(:disabled):hover { filter:brightness(1.08); border-color:var(--accent); }
  .btn.ghost { border-color:transparent; background:none; color:var(--muted); }
  .btn.ghost:hover { color:var(--fg); }
  .btn.sm { padding:3px 9px; font-size:12px; border-radius:8px; }
  .btn.danger { color:var(--bad); }
  .btn .tag { margin-left:2px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--card); max-width:100%; }
  .seg button { border:0; background:none; color:var(--muted); font-size:13px; padding:5px 12px; cursor:pointer; white-space:nowrap; }
  .seg button[aria-pressed="true"] { background:var(--fg); color:var(--bg); }
  .theme button { padding:6px 9px; font-size:14px; line-height:1; }
  .tag { font-size:11px; border-radius:6px; padding:0 6px; white-space:nowrap; line-height:18px; display:inline-block; background:var(--sunk); color:var(--muted); }
  .tag.ok { color:var(--done); background:var(--done-bg); }
  .tag.bad { color:var(--bad); background:var(--bad-bg); }
  .tag.warn { color:var(--warn); background:var(--warn-bg); }
  .tag.info { color:var(--accent); background:var(--accent-bg); }
  .tag.agent { color:var(--agent); background:var(--agent-bg); }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:1px 9px; border-radius:99px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .pill.bp { color:var(--accent); border-color:var(--accent); border-style:dashed; }
  @media (max-width:900px) { .btn .lbl { display:none; } .btn { padding:6px 8px; } .crumbs button { max-width:130px; } }

  /* canvas */
  main { flex:1; display:flex; min-height:0; position:relative; }
  #vp { flex:1; position:relative; overflow:hidden; touch-action:none; cursor:grab; outline:none; user-select:none; -webkit-user-select:none;
    background-color:var(--bg); background-image:radial-gradient(var(--dot) 1px, transparent 1.2px); background-size:22px 22px; }
  #vp.panning { cursor:grabbing; }
  #world { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; transition:opacity .18s ease; }
  #world.fade { opacity:0; }
  #edges { position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible; pointer-events:none; }
  #edges .e { pointer-events:auto; cursor:pointer; }
  #edges .hit { stroke:transparent; stroke-width:14; fill:none; }
  #edges .ln { stroke:var(--edge); fill:none; transition:stroke .15s, opacity .15s; }
  #edges .e.k-request .ln { stroke:light-dark(#9db6ec, #3d5590); }
  #edges .e.async .ln { stroke-dasharray:6 5; }
  #edges .e.ext .ln { stroke:light-dark(#c3b5ee, #4f4278); }
  #edges .e:hover .ln, #edges .e.hot .ln { stroke:var(--edge-hot); opacity:1; }
  .focus #edges .e:not(.hot) .ln { opacity:.25; }
  marker path { fill:var(--edge); } marker.hot path { fill:var(--edge-hot); }
  .colhead { position:absolute; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; white-space:nowrap; pointer-events:none; }
  .colhead small { display:block; text-transform:none; letter-spacing:0; font-weight:400; font-size:12px; }
  .far .colhead { font-size:22px; }
  .frame { position:absolute; border:1px solid var(--line); border-radius:20px; background:light-dark(rgb(255 255 255 / .45), rgb(255 255 255 / .02)); pointer-events:none; }
  .frame .empty { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:20px; color:var(--muted); font-size:13px; }

  .card { position:absolute; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:10px 13px; display:flex; flex-direction:column; gap:2px; cursor:pointer; overflow:hidden; outline:none; transition:box-shadow .15s, border-color .15s, opacity .2s; }
  .card:hover { border-color:var(--muted); }
  .card:focus-visible { box-shadow:0 0 0 3px var(--accent); }
  .card .kd { font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; font-weight:600; }
  .card .kd i { width:8px; height:8px; border-radius:3px; background:var(--kc, var(--muted)); flex:none; }
  .card .tt { font-weight:600; font-size:14.5px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:-.005em; }
  .card .ds { color:var(--muted); font-size:12.5px; line-height:1.38; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow-wrap:anywhere; }
  .card .ft { margin-top:auto; display:flex; gap:5px; align-items:center; font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; padding-top:4px; }
  .card .ft .cnt { overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; min-width:0; }
  .card .ft .tag { flex:none; }
  .card .defs { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .em { display:flex; gap:6px; align-items:baseline; min-width:0; }
  .card .em { margin-bottom:2px; }
  .far .card .em .p { font-size:20px; -webkit-line-clamp:2; }
  .card .em .p { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; flex:1; min-width:0; }
  .meth { font:700 10.5px/18px ui-monospace, SFMono-Regular, Menlo, monospace; padding:0 5px; border-radius:5px; flex:none; background:var(--sunk); color:var(--muted); }
  .meth.GET { color:var(--done); background:var(--done-bg); } .meth.POST { color:var(--accent); background:var(--accent-bg); }
  .meth.PUT, .meth.PATCH { color:var(--warn); background:var(--warn-bg); } .meth.DELETE { color:var(--bad); background:var(--bad-bg); }
  .card .note { margin-top:6px; background:var(--warn-bg); border-radius:8px; padding:5px 8px; font-size:12px; line-height:1.35; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow-wrap:anywhere; }
  .card .asked { font-size:12.5px; line-height:1.35; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow-wrap:anywhere; margin-top:4px; }
  .card .asked b { color:var(--done); font-weight:600; }
  .card .tasks { font-size:11.5px; color:var(--muted); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card.k-screen { --kc:var(--accent); } .card.k-server, .card.k-other { --kc:var(--muted); } .card.k-data { --kc:var(--warn); } .card.k-service { --kc:var(--agent); } .card.k-tool { --kc:var(--line); }
  .card.t-part, .card.t-group { box-shadow:inset 4px 0 0 var(--kc, var(--line)), var(--shadow); padding-left:16px; }
  .card.ext { background:var(--sunk); border-radius:22px; }
  .card.bp { border-style:dashed; border-width:1.5px; border-color:light-dark(#9aa9c9, #4b5a7c); background:light-dark(#fbfcff, #181b22); }
  .card.chg { box-shadow:0 0 0 2px var(--done), var(--shadow); }
  .card.t-part.chg, .card.t-group.chg { box-shadow:inset 4px 0 0 var(--kc, var(--line)), 0 0 0 2px var(--done), var(--shadow); }
  .card.mk { border-color:var(--warn); box-shadow:0 0 0 2px var(--warn), var(--shadow); }
  .card.sel, .card.t-part.sel, .card.t-group.sel { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg), 0 0 0 1px var(--accent), var(--float); }
  .card.dim { opacity:.35; }
  .card.beat { animation:beat 1.2s ease-in-out 2; }
  @keyframes beat { 50% { box-shadow:0 0 0 8px var(--accent-bg), 0 0 0 2px var(--accent); } }
  .card.pl { flex-direction:row; align-items:center; gap:8px; border-radius:99px; padding:6px 14px; }
  .card.pl .tt { font-size:13px; font-weight:500; flex:1; min-width:0; }
  .card.pl .kd { flex:none; } .card.pl .kd span { display:none; }
  .card.pl .ft { margin:0; padding:0; flex:none; }
  .card.pl.more { cursor:default; background:none; border-style:dashed; color:var(--muted); }
  .card .live { position:absolute; top:9px; right:10px; width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 0 var(--accent); animation:live 1.6s ease-out infinite; }
  @keyframes live { 0% { box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 100% { box-shadow:0 0 0 9px transparent; } }
  .card.pl .live { position:static; flex:none; }
  .card .ndot { width:8px; height:8px; border-radius:50%; background:var(--warn); flex:none; }
  .card .step { position:absolute; top:8px; right:10px; min-width:22px; height:22px; padding:0 6px; border-radius:99px; background:var(--accent); color:var(--on-accent); font-size:12px; font-weight:700; display:grid; place-items:center; }
  .card.has-live .tt, .card.has-step .tt { padding-right:22px; }
  .far .card .ds, .far .card .ft .cnt, .far .card .defs, .far .card .kd span, .far .card .tasks { display:none; }
  .far .card .tt { font-size:24px; line-height:1.18; white-space:normal; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow-wrap:anywhere; }
  .far .card .kd { height:10px; }
  .far .card.pl .tt { font-size:20px; -webkit-line-clamp:1; }
  .vfar .card .tt { font-size:32px; }
  .vfar .card .note, .vfar .card .asked { display:none; }

  .zoombar { position:absolute; left:14px; bottom:14px; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--float); overflow:hidden; z-index:4; }
  .zoombar button { border:0; background:none; width:36px; height:34px; display:grid; place-items:center; cursor:pointer; color:var(--fg); }
  .zoombar button + button { border-top:1px solid var(--line); }
  .zoombar button:hover { background:var(--sunk); }
  .banner { position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:4; background:var(--warn-bg); border:1px solid var(--warn); border-radius:12px; padding:6px 8px 6px 14px; font-size:13px; display:flex; gap:10px; align-items:center; max-width:calc(100% - 32px); box-shadow:var(--float); }
  .banner .btn { padding:3px 9px; }

  /* ask bar + flow bar */
  .dock { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); width:min(720px, calc(100% - 120px)); z-index:5; }
  @media (max-width:700px) { .dock { width:calc(100% - 24px); left:12px; transform:none; bottom:10px; } .zoombar { bottom:auto; top:12px; left:auto; right:12px; flex-direction:row; } .zoombar button + button { border-top:0; border-left:1px solid var(--line); } }
  #askbar { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--float); padding:6px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  #askbar:focus-within { border-color:var(--accent); }
  #askbar input { flex:1 1 200px; min-width:0; border:0; background:none; outline:none; padding:6px 8px; font-size:14px; }
  #askbar .seg button { padding:4px 10px; font-size:12px; }
  #askbar .send { width:34px; height:34px; padding:0; justify-content:center; border-radius:11px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; flex-basis:100%; padding:0 2px; }
  .chips:empty { display:none; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:12px; border-radius:99px; background:var(--accent-bg); color:var(--accent); padding:1px 4px 1px 10px; border:0; max-width:240px; }
  .chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip button { border:0; background:none; color:inherit; cursor:pointer; width:18px; height:18px; display:grid; place-items:center; border-radius:50%; padding:0; }
  .chip button:hover { background:var(--card); }
  .busy { flex-basis:100%; display:flex; gap:10px; align-items:center; padding:4px 8px; font-size:13px; }
  .spin { width:14px; height:14px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:spin .8s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .err { color:var(--bad); font-size:13px; flex-basis:100%; padding:2px 8px; }
  .past { position:absolute; left:0; right:0; bottom:calc(100% + 6px); background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--float); padding:6px; max-height:260px; overflow:auto; }
  .past h4 { margin:4px 8px 4px; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; }
  .past button { display:flex; width:100%; gap:10px; text-align:left; border:0; background:none; padding:6px 8px; border-radius:8px; cursor:pointer; }
  .past button:hover, .past button:focus-visible { background:var(--sunk); outline:none; }
  .past button span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #flowbar { background:var(--card); border:1px solid var(--accent); border-radius:16px; box-shadow:var(--float); padding:10px 12px; display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; }
  #flowbar .fn { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--accent); font-weight:600; }
  #flowbar p { margin:0; grid-column:1 / -1; overflow-wrap:anywhere; max-height:30vh; overflow:auto; }
  #flowbar .ctl { display:flex; gap:4px; align-items:center; grid-row:1; grid-column:2; }
  .dots { display:flex; gap:4px; grid-column:1 / -1; }
  .dots i { flex:1; height:3px; border-radius:2px; background:var(--line); }
  .dots i.on { background:var(--accent); }

  /* side panel */
  #panel { width:var(--pw); flex:none; background:var(--card); border-left:1px solid var(--line); position:relative; display:flex; flex-direction:column; min-width:0; }
  #panel.closed { display:none; }
  #grip { position:absolute; left:-4px; top:0; bottom:0; width:8px; cursor:col-resize; z-index:3; }
  #grip:hover, #grip.on { background:linear-gradient(90deg, transparent 3px, var(--accent) 3px, var(--accent) 5px, transparent 5px); }
  #pbody { overflow:auto; padding:16px 18px 40px; flex:1; overscroll-behavior:contain; }
  .sheetbar { display:none; }
  @media (max-width:700px) {
    #panel { position:absolute; left:0; right:0; bottom:0; width:auto; max-height:62%; border-left:0; border-top:1px solid var(--line); border-radius:18px 18px 0 0; box-shadow:var(--float); z-index:8; }
    #grip { display:none; }
    .sheetbar { display:block; height:18px; flex:none; position:relative; }
    .sheetbar::after { content:""; position:absolute; left:50%; top:7px; width:40px; height:4px; border-radius:2px; background:var(--line); transform:translateX(-50%); }
    .crumbs { flex-basis:100%; order:2; } .tools { order:1; flex-wrap:nowrap; overflow-x:auto; max-width:100%; scrollbar-width:none; }
    header { padding:8px 12px; gap:6px; } .tools .btn { padding:5px 7px; } h1 { font-size:15px; } .logo { width:26px; height:26px; }
  }
  .ph { display:flex; gap:8px; align-items:flex-start; }
  .ph h2 { font-size:18px; margin:0; flex:1; min-width:0; overflow-wrap:anywhere; letter-spacing:-.01em; line-height:1.3; }
  .ph .x { flex:none; width:30px; height:30px; padding:0; justify-content:center; }
  .sub { color:var(--muted); font-size:12.5px; overflow-wrap:anywhere; margin-top:2px; }
  .lead { margin:10px 0 0; overflow-wrap:anywhere; }
  .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .acts .msg { font-size:12.5px; color:var(--done); align-self:center; }
  h3 { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:20px 0 6px; font-weight:600; display:flex; gap:6px; align-items:center; }
  h3 .c { font-weight:400; letter-spacing:0; }
  ul.ls { list-style:none; margin:0; padding:0; display:grid; gap:2px; }
  ul.ls li { min-width:0; }
  .lk { border:0; background:none; padding:3px 6px; margin:0 -6px; border-radius:7px; cursor:pointer; text-align:left; display:flex; gap:8px; align-items:baseline; width:calc(100% + 12px); min-width:0; }
  .lk:hover { background:var(--sunk); }
  .lk .t { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lk .r { color:var(--muted); font-size:12px; flex:none; }
  .mdesc { color:var(--muted); font-size:12.5px; overflow-wrap:anywhere; }

  else if (k === " " && e.target.closest?.(".card")) { e.preventDefault(); selectCard(e.target.closest(".card").dataset.id); openPanel(); }
  else if (k === "Backspace" || (k === "ArrowLeft" && e.altKey)) { e.preventDefault(); up(); }
});
addEventListener("resize", () => { if (phone() !== wasPhone) { wasPhone = phone(); renderPanel(); } });
let wasPhone = phone();

// ---------------------------------------------------------------- data loading and polling
async function getText(p) { const r = await fetch(p, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.text(); }
function parseHist(t) { const by = new Map(); (Array.isArray(t) ? t : String(t || "").split("\n")).forEach(l => { try { const e = typeof l === "string" ? (l.trim() ? JSON.parse(l) : null) : l; if (e?.id) by.set(e.id, e); } catch (_) {} }); return [...by.values()]; }
let pollN = 0, loaded = false;
async function poll(force) {
  if (X) return;
  const slow = force || pollN++ % 4 === 0;
  const names = ["map/graph.json", "progress.json", "history.jsonl", ...(slow ? ["map/notes.json", "map/asks.json"] : [])];
  const res = await Promise.all(names.map(n => getText(n).catch(() => "")));
  let gChanged = false, other = false;
  names.forEach((n, i) => {
    const t = res[i]; if (raw[n] === t) return; raw[n] = t;
    try {
      if (n === "map/graph.json") { G = t ? normalize(JSON.parse(t)) : null; gChanged = true; }
      else if (n === "progress.json") { prog = t ? JSON.parse(t) : { sessions: {} }; other = true; }
      else if (n === "history.jsonl") { hist = parseHist(t); other = true; }
      else if (n === "map/notes.json") { notes = t ? JSON.parse(t) : {}; other = true; }
      else if (n === "map/asks.json") { const a = t ? JSON.parse(t) : []; asks = (Array.isArray(a) ? a : []).map(normAsk); other = true; }
    } catch (_) { if (n === "map/graph.json") { G = null; gChanged = true; } }
  });
  if (gChanged) onGraph();
  else if (other && G) { const sig = JSON.stringify([Object.keys(R).sort(), [...EDIT].sort()]); refreshRecent(); const sig2 = JSON.stringify([Object.keys(R).sort(), [...EDIT].sort()]); render({}); if (sig !== sig2 && view.t === "recent") fit(); }
  else if (other && !G) render();
}
function onGraph() {
  $(".emptyst")?.remove();
  dismissedLocal = {}; SI = null;
  if (G) { buildIndex(); G.flows.forEach(f => f.steps = f.steps || []); }
  refreshRecent();
  const first = !loaded; loaded = true;
  if (G && view.t !== "overview" && view.t !== "answer" && view.t !== "recent" && !exists(view.id)) view = { t: "overview" };
  if (sel && !exists(sel)) sel = null;
  lastHtml = ""; render({ fit: first });
  if (first && G) afterFirst();
}
function afterFirst() {
  if (location.hash.startsWith("#select=")) return deepLink();
  const key = "toured:" + (G.project || "") + ":" + (G.root || "");
  if (!store.get(key) && !X) { store.set(key, "1"); setTimeout(tour, 500); }
}
function deepLink() {
  const m = location.hash.match(/^#select=(.+)$/); if (!m || !G) return;
  const id = decodeURIComponent(m[1]); if (!exists(id)) { toast("That isn't on the map any more."); return; }
  if (flow) flow = null;
  openPanel(); panelMode = null; reveal(id);
}
addEventListener("hashchange", deepLink);
addEventListener("storage", e => { if (e.key === "theme") setTheme(e.newValue || "system", true); });

// theme
function setTheme(t, noStore) {
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  if (!noStore) try { localStorage.setItem("theme", t); } catch (_) {}
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeSet === t));
}
document.querySelectorAll("[data-theme-set]").forEach(b => b.onclick = () => setTheme(b.dataset.themeSet));
let th = "system"; try { th = localStorage.getItem("theme") || "system"; } catch (_) {}
setTheme(th, true);

// boot
document.querySelectorAll(".zoombar button").forEach((b, i) => b.innerHTML = ic(["plus", "minus", "fit"][i]));
applyCam();
(async () => {
  if (X) {
    G = X.graph ? normalize(X.graph) : null; notes = X.notes || {}; hist = parseHist(X.history || []); asks = [];
    onGraph(); return;
  }
  try { const r = await fetch("api/ping", { cache: "no-store" }); if (r.status === 404) RO = true; } catch (_) {}
  await poll(true);
  if (!G) render();
  setInterval(() => { if (!document.hidden) poll(); }, 4000);
})();
